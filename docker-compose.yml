services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  mcp:
    build:
      context: ./mcp_server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      - backend
